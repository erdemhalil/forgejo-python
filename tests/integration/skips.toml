# Operations that the smoke suite does not exercise, each with a reason.
#
# The completeness test requires every generated operation to be exercised in
# `smoke.py`, listed here, or excluded in `codegen/registry.toml`. `kind`
# separates harness infrastructure gaps from coverage that is still pending:
#   infrastructure - the harness cannot provide what the operation needs
#   pending        - exercisable with more harness work; not written yet

[[skips]]
operation = "ActionRun"
kind = "infrastructure"
reason = "Requires a completed Actions workflow run; no Actions runner is registered in the harness."

