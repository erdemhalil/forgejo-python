# Curated overrides for the naming algorithm (docs/development/codegen.md).
#
# Namespace overrides are keyed by a path prefix ("/user",
# "/repos/{owner}/{repo}/transfer"):
#   name = "..."  renames the segment at that prefix
#   skip = true   drops the segment from namespace paths (action prefixes that
#                 would otherwise shadow the method)
# Method overrides are keyed by operationId (stable across Spec refreshes):
#   name = "..."        replaces the derived method name
#   deprecated = true   forces the deprecated flag (the Spec flag normally wins)
# Model overrides are keyed by definition name; build_ir validates them.
#
# Every entry exists because the derived name was wrong, ambiguous, or
# collided; codegen/naming-report.md shows the resulting surface.

# --- Action prefixes flattened into methods ---------------------------------

# POST /repos/{owner}/{repo}/pulls/{index}/merge -> repos.pulls.merge(...)
[namespaces."/repos/{owner}/{repo}/pulls/{index}/merge"]
skip = true

[methods.repoMergePullRequest]
name = "merge"

# POST /repos/{owner}/{repo}/issues/{index}/pin -> repos.issues.pin(...)
[namespaces."/repos/{owner}/{repo}/issues/{index}/pin"]
skip = true

[methods.pinIssue]
name = "pin"

[methods.unpinIssue]
name = "unpin"

[methods.moveIssuePin]
name = "move"

# POST /repos/{owner}/{repo}/transfer -> repos.transfer(...)
[namespaces."/repos/{owner}/{repo}/transfer"]
skip = true

[methods.repoTransfer]
name = "transfer"

[methods.acceptRepoTransfer]
name = "accept_transfer"

[methods.rejectRepoTransfer]
name = "reject_transfer"

# PUT /orgs/{org}/block/{username} -> orgs.block(org, username)
[namespaces."/orgs/{org}/block"]
skip = true

[methods.orgBlockUser]
name = "block"

[namespaces."/orgs/{org}/unblock"]
skip = true

[methods.orgUnblockUser]
name = "unblock"

[namespaces."/user/block"]
skip = true

[methods.userBlockUser]
name = "block"

[namespaces."/user/unblock"]
skip = true

[methods.userUnblockUser]
name = "unblock"

# POST /packages/{owner}/{type}/{name}/-/link/{repo_name} -> packages.link(...)
[namespaces."/packages/{owner}/{type}/{name}/-/link"]
skip = true

# GET /repos/{owner}/{repo}/compare/{basehead} -> repos.compare(basehead)
[namespaces."/repos/{owner}/{repo}/compare"]
skip = true

[methods.repoCompareDiff]
name = "compare"

# --- Collisions: distinct endpoints sharing a derived namespace/method ------

# packages/{owner} lists packages while packages/{owner}/{type}/... gets one.
[methods.listPackages]
name = "list"

# The repo-wide comment endpoints and the deprecated issue-scoped ones share
# repos.issues.comments.
[methods.issueGetRepoComments]
name = "list_all"

[methods.issueDeleteCommentDeprecated]
name = "delete_for_issue"

[methods.issueEditCommentDeprecated]
name = "update_for_issue"

# Repository contents: the batch endpoint vs. the single-file POST.
[methods.repoChangeFiles]
name = "change_files"

# Pull requests: {index}/merge, {index}/update, and {base}/{head} would all
# collide with the pulls CRUD methods.
[methods.repoPullRequestIsMerged]
name = "is_merged"

[methods.repoCancelScheduledAutoMerge]
name = "cancel_auto_merge"

[methods.repoUpdatePullRequest]
name = "update_branch"

[methods.repoGetPullRequestByBaseHead]
name = "get_by_base_head"

# Issue labels/times: delete-all vs. delete-one share the derived name.
[methods.issueClearLabels]
name = "clear"

[methods.issueResetTime]
name = "reset"

# Topics: PUT on the collection replaces, PUT on an item adds.
[methods.repoAddTopic]
name = "add"

[methods.repoDeleteTopic]
name = "remove"

# Flags: PUT on the collection replaces, PUT on an item adds.
[methods.repoAddFlag]
name = "add"

[methods.repoDeleteFlag]
name = "remove"

[methods.repoDeleteAllFlags]
name = "delete_all"

# Diff/patch downloads live beside the item GET ({sha}.{diffType}).
[methods.repoDownloadCommitDiffOrPatch]
name = "download"

[methods.repoDownloadPullDiffOrPatch]
name = "download"

# Actions.
[methods.DownloadActionArtifact]
