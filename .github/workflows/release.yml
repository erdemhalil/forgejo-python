name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release, e.g. v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Verify version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "Tag must start with v (got: $TAG)"; exit 1;;
          esac
          TAG_VERSION="${TAG#v}"
          PROJECT_VERSION="$(uv version --short)"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Version mismatch:"
            echo "  Git tag:        $TAG_VERSION"
            echo "  Project version: $PROJECT_VERSION"
            exit 1
          fi

      - name: Build the distributions
        run: uv build

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate publish attestations
        uses: astral-sh/attest-action@v0.0.6

      - name: Publish to PyPI
        run: uv publish

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"

          awk -v "ver=$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## / { capture = 0 }
            capture { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            printf 'Release %s\n' "$TAG" > /tmp/release-notes.md
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.whl --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file /tmp/release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md \
              --repo "$GITHUB_REPOSITORY" dist/*.tar.gz dist/*.whl
          fi
